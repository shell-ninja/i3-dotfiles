[global/wm]
include-file = ~/.config/polybar/colors.ini
include-file = ~/.config/polybar/modules.ini


[bar/myBar]
width = 100%
height = 22pt

# offset-x = 5%
# offset-y = 1%

radius = 0

fixed-center = true

; dpi = 100

background = ${colors.background}
foreground = ${colors.foreground}

# line-size = 3pt

border-bottom-size = 3
border-bottom-color = ${colors.primary}

# border-left-size = 15
# border-left-color = #00000000
#
# border-right-size = 15
# border-right-color = #00000000

padding-left = 1
padding-right = 2

module-margin = 1

separator = 
separator-foreground = ${colors.alert}


font-0 = JetBrainsMono Nerd Font:size=12;4
font-2 = "MesloLGS NF:style=Regular:size=15;3"
font-3 = "FontAwesome:Size=2;3"
font-4 = "Iosevka Nerd Font:pixelsize=10;3"
font-5 = "Iosevka Nerd Font:style=Medium:size=22;5"

modules-left = launcher workspaces
modules-center = 
modules-right = updates wall cliphist pulseaudio tray date powermenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

# wm-restack = i3

; override-redirect = true

format-margin = 8pt
